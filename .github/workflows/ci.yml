name: CI

# 日常构建校验：main 分支与 PR 上跑一次 Release 构建，尽早暴露编译 / XAML 错误。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Images/**'
      - '.github/**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: DreamUnrealManager.sln
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: 构建 (Release / x64)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 还原依赖
        run: dotnet restore ${{ env.SOLUTION_PATH }} -p:Platform=x64

      - name: 构建
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release -p:Platform=x64 --no-restore
